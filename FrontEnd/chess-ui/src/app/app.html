<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Page Title</title>
  
</head>
<body>
<div class="board">
  @for (square of squares; track square.index) {
    <div class="square" [class]="square.color" (click)="onSquareClick(square)">
      @if (square.piece) {
        <img [src]="'assets/pieces/' + square.piece + '.svg'" />
      
      }
    </div>
  }
  
</div>
</body>
</html>
